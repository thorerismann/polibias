g or treatment of the topic. Quoted voices are not present.",0.95],["qwen2.5:3b-instruct","1","Cathinfo",-1.0,-1.0,-1.0,-1.0,"The article focuses on the conflict between Christian leaders and the Israeli\u003cbr\u003egovernment, with a clear left-leaning bias towards the stance of the Christian\u003cbr\u003eleaders against sionism.",1.0],["qwen2.5:3b-instruct","2","Cathinfo",-0.4,-0.6,-0.5,0.0,"The article focuses on a religious art piece with environmental and social themes,\u003cbr\u003eleaning left in its subject matter and framing. The artist's perspective is presented\u003cbr\u003ewithout bias.",1.0],["qwen2.5:3b-instruct","2","Cathinfo",-0.4,-0.6,-0.5,0.0,"The article focuses on a Vatican appointment and its positive reception, highlighting\u003cbr\u003ethe nominee's international experience and commitment to marginalized individuals\u003cbr\u003ewithout overtly favoring either political stance.",1.0],["qwen2.5:3b-instruct","2","Cathinfo",0.0,0.0,0.0,0.0,"The article discusses the religious observances of Lent (Car\u00eame) and Ramadan,\u003cbr\u003efocusing on their dates and practices without taking a stance or favoring one side\u003cbr\u003eover the other.",1.0],["qwen2.5:3b-instruct","2","Cathinfo",-0.4,-0.6,-0.5,0.0,"The article focuses on a Catholic Church initiative promoting peace through\u003cbr\u003eEucharistic prayer, leaning slightly left in its subject matter and framing tone.",1.0],["qwen2.5:3b-instruct","2","Cathinfo",-0.5,-0.75,-0.5,0.0,"The article focuses on the temptations of Jesus and their implications for Christian\u003cbr\u003epractices, presenting a critical perspective that leans left.",1.0],["qwen2.5:3b-instruct","2","Cathinfo",0.0,-1.0,-1.0,0.0,"The article focuses on religious teachings and does not contain any direct political\u003cbr\u003econtent or bias towards specific political figures.",0.95],["qwen2.5:3b-instruct","2","Cathinfo",0.0,-0.2,-0.4,0.0,"The article focuses on a historical event related to the Pope, showing no clear e partialit\u00e9 politique ou religieuse. La couverture est limit\u00e9e aux d\u00e9tails de l'organisation et aux dates des c\u00e9l\u00e9brations eucharistiques, sans \u00e9voquer des positions politiques ou religieuses partiales."],["cathinfo_662888994570","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente une analyse chr\u00e9tienne de la tentation de J\u00e9sus, mettant en avant la r\u00e9sistance du Christ aux tentations du diable et les cons\u00e9quences pour les disciples. Le ton est r\u00e9fl\u00e9chi et critique, avec des r\u00e9f\u00e9rences bibliques et des exemples historiques."],["cathinfo_234305067909","llama3.2:latest",1,"cathinfo",""],["cathinfo_702696857698","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente un ton neutre et objectif, en mettant en avant les objets personnels du pape Joseph Ratzinger sans prendre position sur son parcours ou ses id\u00e9es. Les \u00e9v\u00e9nements organis\u00e9s pour comm\u00e9morer sa naissance sont pr\u00e9sent\u00e9s de mani\u00e8re informative et objective."],["cathinfo_194493006529","llama3.2:latest",1,"cathinfo","Cependant, l'article ne fournit pas d'analyse plus profonde sur les implications politiques ou sociales de cette directive, ce qui limite sa port\u00e9e et son impact."],["cathinfo_661375637771","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente une vision fortement critique du nationalisme et de l'extr\u00eame droite, en soulignant les dangers de la discrimination et de l'intol\u00e9rance. Le cardinal Marx est cit\u00e9 pour souligner l'importance de respecter la dignit\u00e9 humaine et de promouvoir un dialogue men\u00e9 d'\u00e9gal \u00e0 \u00e9gal."],["cathinfo_124594657656","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente une vision g\u00e9n\u00e9rale positive du d\u00e9c\u00e8s de Polycarp Pengo, en soulignant son r\u00f4le dans le dialogue islamo-chr\u00e9tien et sa position au sein de l'\u00c9glise catholique. Le ton est neutre et informatif."],["cathinfo_891457785609","llama3.2:latest",1,"cathinfo",null],["cathinfo_531492784938","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente un ton neutre et objectif, sans any de pr\u00e9jug\u00e9s \u00e0 gauche ou droite. La narration est centr\u00e9e sur l'histoire du saint Fran\u00e7ois d'Assise et les \u00e9v\u00e9nements entourant l'exhumation de ses ossements."],["cathinfo_830107454762","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente une vision nettement critique du sionisme chr\u00e9tien et des initiatives de son parti, The Israeli Christian Voice, en lien avec les patriarches de J\u00e9rusalem. Le ton est domin\u00e9 par une perspective catholique et une critique des positions isra\u00e9liennes sur le territoire palestinien. Les sources cit\u00e9es sont souvent des partisans du renouveau catholique et des leaders \u00e9vang\u00e9liques qui soutiennent la cause sioniste. La repr\u00e9sentation des chr\u00e9tiens palestiniens est limit\u00e9e, ce qui peut donner une image biais\u00e9e de la situation."],["cathinfo_014119745235","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente un sujet neutre (la tenture de Car\u00eame) et une framing neutre, mais avec des \u00e9l\u00e9ments qui pourraient \u00eatre per\u00e7us comme favorables \u00e0 la gauche (abordage des d\u00e9fis mondiaux tels que le changement climatique), tandis que les quotes de l'artiste semblent plus centr\u00e9es sur l'importance d'une sensibilisation aux probl\u00e8mes mondiaux sans prendre position politique."],["cathinfo_034785673294","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente une pr\u00e9sentation \u00e9quilibr\u00e9e de l'engagement de Markus Cott en faveur des personnes d\u00e9favoris\u00e9es, mais manque de d\u00e9tails sur son engagement politique sp\u00e9cifique. La mention de la musique comme piste pour promouvoir la dimension universelle de l'\u00c9glise est une approche positive et inclusive."],["cathinfo_259731758893","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente un ton neutre et objectif, expliquant les diff\u00e9rences entre le Car\u00eame et le Ramadan sans prendre position politique. Les informations sont fournies de mani\u00e8re claire et concise."],["cathinfo_340304832807","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente un sujet neutre, concernant une c\u00e9l\u00e9bration de pri\u00e8re eucharistique organis\u00e9e par le Conseil des conf\u00e9rences \u00e9piscopales d\u2019Europe. Le ton est formel et impartial, sans indiquer une pr\u00e9f\u00e9rence politique ou religieuse."],["cathinfo_662888994570","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente un point de vue chr\u00e9tien et critique les tentations du d\u00e9sert en relation avec la foi et le message de J\u00e9sus. Le ton est r\u00e9fl\u00e9chi et analytique, sans \u00eatre trop partisan ou d\u00e9fensif."],["cathinfo_234305067909","llama3.2:latest",2,"cathinfo",""],["cathinfo_702696857698","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente un ton neutre et objectif, sans anymesse ni attaque contre la personnalit\u00e9 de Joseph Ratzinger ou son pontificat. Les informations sont pr\u00e9sent\u00e9es de mani\u00e8re impartiale, en \u00e9vitant les jugements de valeur."],["cathinfo_194493006529","llama3.2:latest",2,"cathinfo","La publication de la GCBC est un exemple de l'engagement du Vatican dans la d\u00e9fense des droits des communaut\u00e9s religieuses."],["cathinfo_661375637771","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente une vision tr\u00e8s critique du nationalisme et de l'extr\u00eame droite, en mettant en avant les valeurs chr\u00e9tiennes et la dignit\u00e9 humaine. Le ton est domin\u00e9 par un discours moralisateur et p\u00e9dagogique, qui cherche \u00e0 \u00e9duquer le lecteur sur les dangers du nationalisme et de l'antis\u00e9mitisme."],["cathinfo_124594657656","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente un ton neutre et ne contient aucune r\u00e9f\u00e9rence politique \u00e9vidente. Le sujet de la mort d'un c 5637771","cathinfo_124594657656","cathinfo_891457785609","cathinfo_531492784938","cathinfo_830107454762","cathinfo_014119745235","cathinfo_034785673294","cathinfo_259731758893","cathinfo_340304832807","cathinfo_662888994570","cathinfo_234305067909","cathinfo_702696857698","cathinfo_194493006529","cathinfo_661375637771","cathinfo_124594657656","cathinfo_891457785609","cathinfo_531492784938","cathinfo_830107454762"],"xaxis":"x4","y":{"dtype":"f8","bdata":"AAAAAAAA4L8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACamZmZmZm5vwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPC\u002fAAAAAAAAAAAAAAAAAAD4f3sUrkfheoQ\u002fAAAAAAAA8L8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPA\u002fAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8D8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADwvw=="},"yaxis":"y4","type":"scatter"},{"customdata":[["cathinfo_014119745235","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente une vision globale du changement climatique et de ses cons\u00e9quences, sans prendre parti politique. La framing est l\u00e9g\u00e8rement tendue en faveur d'un message de sensibilisation."],["cathinfo_034785673294","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente un sujet neutre (la nomination de Markus Cott) et une framing neutre, traitant les deux parties politiques avec impartialit\u00e9. Les citations de Markus Cott et du Conseil de fondation de Missio Suisse sont \u00e9galement neutres, en soulignant l'importance de la mission universelle et de la dimension universelle de l'\u00c9glise. Le ton est formel et respectueux."],["cathinfo_259731758893","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente un ton neutre et objectif, sans pr\u00e9f\u00e9rence pour une id\u00e9ologie ou une religion en particulier. Les informations sont pr\u00e9sent\u00e9es de mani\u00e8re claire et concise sur les points communs et les diff\u00e9rences entre le Car\u00eame et le Ramadan."],["cathinfo_340304832807","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente une approche neutre et informative sur l'initiative de la cha\u00eene de pri\u00e8re eucharistique organis\u00e9e par le Conseil des conf\u00e9rences \u00e9piscopales d\u2019Europe, sans faire preuve de partialit\u00e9 politique ou religieuse. La couverture est limit\u00e9e aux d\u00e9tails de l'organisation et aux dates des c\u00e9l\u00e9brations eucharistiques, sans \u00e9voquer des positions politiques ou religieuses partiales."],["cathinfo_662888994570","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente une analyse chr\u00e9tienne de la tentation de J\u00e9sus, mettant en avant la r\u00e9sistance du Christ aux tentations du diable et les cons\u00e9quences pour les disciples. Le ton est r\u00e9fl\u00e9chi et critique, avec des r\u00e9f\u00e9rences bibliques et des exemples historiques."],["cathinfo_234305067909","llama3.2:latest",1,"cathinfo",""],["cathinfo_702696857698","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente un ton neutre et objectif, en mettant en avant les objets personnels du pape Joseph Ratzinger sans prendre position sur son parcours ou ses id\u00e9es. Les \u00e9v\u00e9nements organis\u00e9s pour comm\u00e9morer sa naissance sont pr\u00e9sent\u00e9s de mani\u00e8re informative et objective."],["cathinfo_194493006529","llama3.2:latest",1,"cathinfo","Cependant, l'article ne fournit pas d'analyse plus profonde sur les implications politiques ou sociales de cette directive, ce qui limite sa port\u00e9e et son impact."],["cathinfo_661375637771","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente une vision fortement critique du nationalisme et de l'extr\u00eame droite, en soulignant les dangers de la discrimination et de l'intol\u00e9rance. Le cardinal Marx est cit\u00e9 pour souligner l'importance de respecter la dignit\u00e9 humaine et de promouvoir un dialogue men\u00e9 d'\u00e9gal \u00e0 \u00e9gal."],["cathinfo_124594657656","llama3.2:latest",1,"cathinfo","L'article pr\u00e9sente une vision g\u00e9n\u00e9rale positive du d\u00e9c\u00e8s de Polycarp Pengo, en soulignant son tion de la musique comme piste pour promouvoir la dimension universelle de l'\u00c9glise est une approche positive et inclusive."],["cathinfo_259731758893","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente un ton neutre et objectif, expliquant les diff\u00e9rences entre le Car\u00eame et le Ramadan sans prendre position politique. Les informations sont fournies de mani\u00e8re claire et concise."],["cathinfo_340304832807","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente un sujet neutre, concernant une c\u00e9l\u00e9bration de pri\u00e8re eucharistique organis\u00e9e par le Conseil des conf\u00e9rences \u00e9piscopales d\u2019Europe. Le ton est formel et impartial, sans indiquer une pr\u00e9f\u00e9rence politique ou religieuse."],["cathinfo_662888994570","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente un point de vue chr\u00e9tien et critique les tentations du d\u00e9sert en relation avec la foi et le message de J\u00e9sus. Le ton est r\u00e9fl\u00e9chi et analytique, sans \u00eatre trop partisan ou d\u00e9fensif."],["cathinfo_234305067909","llama3.2:latest",2,"cathinfo",""],["cathinfo_702696857698","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente un ton neutre et objectif, sans anymesse ni attaque contre la personnalit\u00e9 de Joseph Ratzinger ou son pontificat. Les informations sont pr\u00e9sent\u00e9es de mani\u00e8re impartiale, en \u00e9vitant les jugements de valeur."],["cathinfo_194493006529","llama3.2:latest",2,"cathinfo","La publication de la GCBC est un exemple de l'engagement du Vatican dans la d\u00e9fense des droits des communaut\u00e9s religieuses."],["cathinfo_661375637771","llama3.2:latest",2,"cathinfo","L'article pr\u00e9sente une vision tr\u00e8s critique du nationalisme et de l'extr\u00eame droite, en mettant en avant les valeurs chr\u00e9tiennes et la dignit\u00e9 humaine. Le ton est domin\u00e9 par un discours moralisateur et p\u00e9dagogique, qui cherche \u00e0 \u00e9duquer le lecteur sur les dangers du nationalisme . Il n'y a pas d'invit\u00e9s ou de discours politiques distincts mentionn\u00e9s."],["cathinfo_661375637771","phi3.5:latest",1,"cathinfo","The article clearly leans left by criticizing nationalist and racist ideologies from a Catholic perspective, emphasizing human dignity as central to politics according to Christian values."],["cathinfo_124594657656","phi3.5:latest",1,"cathinfo","L'article est factuel et informatif sur la mort d'un archev\u00eaque sans aucune indication de parti pris ou biais politique. Le sujet choisi n\u2019indique pas un alignement \u00e0 gauche ni \u00e0 droite."],["cathinfo_891457785609","phi3.5:latest",1,"cathinfo",null],["cathinfo_531492784938","phi3.5:latest",1,"cathinfo","The article maintains a neutral subject bias about the historical event of Saint Francis' death anniversary with no clear political leaning. The framing is slightly left-leaning due to religious context and reverence for Christian traditions but still largely impartial overall. Treatment towards both sides seems balanced without explicit favoritism, hence a neutral treatment bias score. No specific guests or speakers are mentioned that would indicate any political leanings in the 'guests_bias'. The confidence level is high due to clear indications of religious reverence rather than overt politicization."],["cathinfo_830107454762","phi3.5:latest",1,"cathinfo","The article frames the issue with a negative view of Christian Zionism and suggests criticism towards it without presenting opposing perspectives equally; treatment leans slightly against this group."],["cathinfo_014119745235","phi3.5:latest",2,"cathinfo","L'article pr\u00e9sente une tenture de Car\u00eame avec un titre qui critique le consumisme ('La grande bouffe'), ce qui sugg\u00e8re un l\u00e9ger penchant \u00e0 gauche envers les pr\u00e9occupations environnementales et sociales. Le ton est r\u00e9flexif mais fortement critiquant, sans biais clair vers aucun camp politique sp\u00e9cifique concernant des invit\u00e9s ou leur traitement."],["cathinfo_034785673294","phi3.5:latest",2,"cathinfo","The article is factual and informative about Markus Cott's appointment without showing any political bias or favoritism towards a particular side."],["cathinfo_259731758893","phi3.5:latest",2,"cathinfo","L'article pr\u00e9sente des informations factuelles sur les dates et la signification du Car\u00eame sans une inclinaison partisane \u00e9vidente. La mention de l'A\u00efd-el-Fitr montre un peu d\u2019\u00e9quilibre mais reste neutre dans le contexte politique."],["cathinfo_340304832807","phi3.5:latest",2,"cathinfo","The article maintains a slight left-leaning bias due to its focus on peace and diplomacy within the context of religious practice; however, it is fairly neutral overall as there are no overtly right-wing perspectives presented. The framing emphasizes unity in prayer for conflict resolution without political partisanship."],["cathinfo_662888994570","phi3.5:latest",2,"cathinfo","The article leans left by critiquing the misuse of Christian teachings for worldly gains and highlights historical instances where followers succumbed to such temptations. The framing is critical towards actions that deviate from spiritual intentions."],["cathinfo_234305067909","phi3.5:latest",2,"cathinfo","L'article pr\u00e9sente une pr\u00e9occupation religieuse sans biais politique clair et neutre dans le sujet choisi ou la narration. Cependant, il y a un l\u00e9ger penchant vers les perspectives conservatrices en mettant l'accent sur des pratiques traditionnelles de pri\u00e8re."],["cathinfo_702696857698","phi3.5:latest",2,"cathinfo","L'article traite la naissance et le pontificat de Joseph Ratzinger (Beno\u00eet XVI) avec un l\u00e9ger angle conservateur en mettant l'accent sur ses origines r\u00e9gionales allemandes et les objets sacr\u00e9s associ\u00e9s \u00e0 son r\u00f4le. Cependant, il est neutre sans une forte inclinaison politique."],["cathinfo_194493006529","phi3.5:latest",2,"cathinfo","L'article aborde une question religieuse sans fournir de ton ou d\u2019argumentation politique clairement \u00e0 droite ou \u00e0 gauche; il met plut\u00f4t en lumi\u00e8re des probl\u00e8mes au sein m\u00eame de l\u2019espace sacr\u00e9 ind\u00e9pendant du parti pris. Les invit\u00e9s ne sont pas politiquement align\u00e9s, donc un score neutre est appropri\u00e9."],["cathinfo_661375637771","phi3.5:latest",2,"cathinfo","The article clearly leans left by criticizing nationalist and right-wing ideologies such as AfD in Germany while promoting Christian values of human dignity and equality. The tone is also critical towards these political trends."],["cathinfo_124594657656","phi3.5:latest",2,"cathinfo","L'article est factuel et informatif sans aucune indication de parti pris ou d'orientation politique partisane. Il parle simplement des r\u00e9alisations du cardinal Pengo dans son r\u00f4le eccl\u00e9siastique."],["cathinfo_891457785609","phi3.5:latest",2,"cathinfo",null],["cathinfo_531492784938","phi3.5:latest",2,"cathinfo","The article presents historical facts about Saint Francis of Assise and his veneration without a clear political slant or bias towards any side. The framing is mostly factual with slight negative connotation due to the reference to macabre which might slightly lean left but overall neutral. Guests, if present in interviews, are not indicated as having strong right-leaning views."],["cathinfo_830107454762","phi3.5:latest",2,"cathinfo",null]],"hovertemplate":"model=%{customdata[1]}\u003cbr\u003edimension=guests_bias\u003cbr\u003ebias=%{y}\u003cbr\u003earticle_id=%{customdata[0]}\u003cbr\u003erun=%{customdata[2]}\u003cbr\u003esource=%{customdata[3]}\u003cbr\u003ecomment=%{customdata[4]}\u003cextra\u003e\u003c\u002fextra\u003e","legendgroup":"phi3.5:latest","marker":{"color":"#B6E880","symbol":"circle"},"mode":"markers","name":"phi3.5:latest","orientation":"v","showlegend":false,"x":["cathinfo_014119745235","cathinfo_034785673294","cathinfo_2597317
