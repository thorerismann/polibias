        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.3.1.min.js" integrity="sha256-4rD3fugVb/nVJYUv5Ky3v+fYXoouHaBSP20WIJuEiWg=" crossorigin="anonymous"></script>                <div id="32fa9024-26b1-444a-8f05-6a8c53c4f836" class="plotly-graph-div" style="height:500px; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("32fa9024-26b1-444a-8f05-6a8c53c4f836")) {                    Plotly.newPlot(                        "32fa9024-26b1-444a-8f05-6a8c53c4f836",                        [{"customdata":[["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,0.0,0.0,"The article focuses on the legal controversy surrounding a hate crime charge against\u003cbr\u003ean individual who was allegedly involved in vandalizing the New York Times building\u003cbr\u003ewith anti-Semitic slogans and leaflets accusing the newspaper of complicity in the\u003cbr\u003eGaza genocide. The evidence presented by prosecutors is criticized as flimsy, raising\u003cbr\u003equestions about the legitimacy of the charges.",0.75],["MichelRosselli\u002fapertus:latest","1","Jacobin",null,null,null,null,"(no comment)",null],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,-1.0,0.0,"The article discusses the history of Lincoln Hospital takeover and the establishment\u003cbr\u003eof Lincoln Detox Center, highlighting the role of activists like Young Lords in\u003cbr\u003edemanding better health services for underserved communities.",0.978256],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,-1.0,0.0,"The article discusses the origin of power research, influences from Tom Hayden and C.\u003cbr\u003eWright Mills, and its application to US foreign policy, especially the Dominican\u003cbr\u003eRepublic invasion in 1965.",0.95],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses the IOC's exploration of new financing sources, including\u003cbr\u003eprivate equity, to cover the costs of hosting events. The framing is left-leaning as\u003cbr\u003eit highlights potential issues with private equity and its impact on sports\u003cbr\u003eoperations. The treatment bias is neutral as there are no clear indications of\u003cbr\u003efavoritism towards either side.",0.75],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses the challenges of ethical consumerism for low-income\u003cbr\u003eindividuals and criticizes efforts that blame them for not making 'ethical' choices\u003cbr\u003edue to limited resources.",0.95],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,-1.0,0.0,"This article provides a comprehensive overview of the ongoing genocide in Gaza and\u003cbr\u003eits impact on civilians. It highlights the scale of destruction, the lack of\u003cbr\u003ehumanitarian aid access, and the continued violence despite the ceasefire agreement.",0.95],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses the historical strategy of targeting drug cartel leaders and\u003cbr\u003eits limited success in reducing violence and drug trafficking, arguing that this\u003cbr\u003eapproach overlooks the complex nature of organized crime networks.",0.95],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,-1.0,0.0,"The article discusses the need for an investigative commission to handle a complex\u003cbr\u003ecase involving child sexual abuse and human trafficking, as well as potential foreign\u003cbr\u003einterference and illegal financing in French politics. The author emphasizes that\u003cbr\u003esuch a commission would allow victims to testify and provide clarity on murky points,\u003cbr\u003eincluding potential involvement of high-profile figures.",0.85],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,-1.0,0.0,"The article presents a neutral subject bias, with no clear left or right leaning in\u003cbr\u003ethe topic selection.",0.98],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,0.0,0.0,"The article covers the interactions between Mexican President Claudia Sheinbaum and\u003cbr\u003eUS President Donald Trump. It highlights the president's strategy of handling\u003cbr\u003ecommunications directly with Trump, bypassing Senator Rubio. The tone is critical\u003cbr\u003etowards Trump's actions and comments about Mexico, while praising Sheinbaum's\u003cbr\u003eleadership and security policy.",0.75],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,-1.0,0.0,"The article discusses grassroots movements in Sweden led by mothers, focusing on\u003cbr\u003etheir demands for public accountability and better care for children with\u003cbr\u003edisabilities. The tone is critical of the underfunding and discrimination faced by\u003cbr\u003ethese groups, which could be seen as left-leaning.",0.85],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses the history and current status of universal childcare in New\u003cbr\u003eYork City, focusing on its political economy and administrative challenges.",0.75],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,-1.0,0.0,"The article focuses on labor union membership trends in the private sector, with a\u003cbr\u003eneutral tone and treatment of political actors.",0.85],["MichelRosselli\u002fapertus:latest","1","Jacobin",0.0,-1.0,-1.0,0.0,"The article discusses the rise of hyperpolitics and its impact on modern political\u003cbr\u003eengagement, highlighting the decline of institutionalized involvement and the shift\u003cbr\u003etowards single-issue demands.",0.85],["MichelRosselli\u002fapertus:latest","2","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses a controversial case involving the arrest of Alexei Wilkinson\u003cbr\u003efor alleged hate crime against New York Times staff, stemming from a July 30\u003cbr\u003evandalism incident and subsequent social media posts. The evidence presented by\u003cbr\u003eprosecutors is deemed flimsy by legal experts, raising questions about the legitimacy\u003cbr\u003eof the charges.",0.65],["MichelRosselli\u002fapertus:latest","2","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses the UAW's strategy for organizing workers in auto plants,\u003cbr\u003eemphasizing momentum-based methods over traditional structure-based approaches. It\u003cbr\u003ehighlights successful cases and challenges faced, offering insights into labor\u003cbr\u003emovement strategies.",0.95],["MichelRosselli\u002fapertus:latest","2","Jacobin",0.0,-1.0,-1.0,0.0,"The article discusses the history of Lincoln Hospital's takeover by Young Lords\u003cbr\u003eactivists and the creation of the People's Program, which later became Lincoln Detox\u003cbr\u003eCenter. The framing is generally critical of the existing healthcare system and\u003cbr\u003esupportive of the activist efforts to improve health services in underserved\u003cbr\u003ecommunities.",0.95],["MichelRosselli\u002fapertus:latest","2","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses the origins and influences of power research, with a focus on\u003cbr\u003epersonal experiences and academic background. It does not show any clear bias towards\u003cbr\u003eleft or right political leanings.",0.95],["MichelRosselli\u002fapertus:latest","2","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses the IOC's exploration of new financing sources, including\u003cbr\u003eprivate equity. The framing is left-leaning as it highlights potential negative\u003cbr\u003easpects (e.g., 'not cheap' and 'their tools are not particularly novel'). Treatment\u003cbr\u003ebias is unclear since no clear favoritism towards either side is evident.",0.85],["MichelRosselli\u002fapertus:latest","2","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses the challenges of ethical consumption for low-income\u003cbr\u003eindividuals and critiques boycotts as often being ineffective or blaming victims\u003cbr\u003erather than addressing systemic issues.",0.85],["MichelRosselli\u002fapertus:latest","2","Jacobin",-1.0,-1.0,-1.0,0.0,"The article provides a detailed and critical analysis of the ongoing conflict in\u003cbr\u003eGaza, highlighting the scale of destruction inflicted on Palestinians, the lack of\u003cbr\u003ehumanitarian aid access, and the continuation of violence despite a ceasefire\u003cbr\u003eagreement.",0.95],["MichelRosselli\u002fapertus:latest","2","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses the capture of El Mencho, a leader of one of Mexico's major\u003cbr\u003edrug trafficking organizations, and its potential impact on violence in the country.\u003cbr\u003eThe author argues that the idea of drug cartels as centralized entities is a fiction\u003cbr\u003ecreated by US foreign policy to serve their interests.",0.85],["MichelRosselli\u002fapertus:latest","2","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses the need for an investigative commission to clarify aspects of\u003cbr\u003ethe Epstein case in France, including potential child sexual abuse and human\u003cbr\u003etrafficking, foreign interference, and illegal financing. The focus is on\u003cbr\u003etransparency and clarity rather than taking a political stance.",0.85],["MichelRosselli\u002fapertus:latest","2","Jacobin",0.0,-1.0,-1.0,0.0,"The article discusses the policies and rhetoric of Rodrigo Chaves, a right-leaning\u003cbr\u003epolitician in Costa Rica. The tone is critical towards his approach to governance,\u003cbr\u003ewhich emphasizes confrontation with political elites while implementing technocratic\u003cbr\u003eeconomic policies.",0.95],["MichelRosselli\u002fapertus:latest","2","Jacobin",0.0,-1.0,0.0,0.0,"The article discusses the interactions between Mexican President Claudia Sheinbaum\u003cbr\u003eand US President Donald Trump, focusing on their phone calls and public statements.\u003cbr\u003eThe tone is critical of Trump's inconsistent policies and paranoid co research. The tone is conversational and lacks any overtly left-leaning or right-leaning framing."],["jacobin_037208927550","llama3.2:latest",1,"jacobin","The article presents a neutral view on the topic of private equity investment in the Olympics, with no clear left or right leaning. The language used is formal and objective, suggesting a balanced approach to the subject."],["jacobin_083341702733","llama3.2:latest",1,"jacobin","The article presents a nuanced view on the challenges of boycotts, highlighting the difficulties faced by lower-income individuals in making ethical purchasing decisions. The author argues that efforts to promote shopping differently often blame the victim rather than addressing the root issue of concentrated wealth and power."],["jacobin_265555549188","llama3.2:latest",1,"jacobin","The article presents a strongly left-leaning perspective on the Israeli-Palestinian conflict, criticizing Israel's actions and framing the situation as a genocide. The language used is emotive and critical of Israel, with phrases such as \"brutally and systematically dismantled\" and \"genocide within the context of a decades-old colonial occupation.\" The article also highlights the humanitarian crisis in Gaza and the lack of access to aid, which could be seen as a critique of Israel's policies. However, it is essential to note that the article does not provide a balanced view of the conflict and may be biased towards the Palestinian perspective."],["jacobin_269917965252","llama3.2:latest",1,"jacobin","The article presents a nuanced view of the drug trade, highlighting the limitations of the 'war on drugs' and the complexity of organized crime in Mexico. The author critiques the US foreign policy approach and challenges the conventional narrative about cartels, suggesting that they are not centralized organizations but rather networks of intermarried families and friends."],["jacobin_234638554041","llama3.2:latest",1,"jacobin","The article presents a left-leani
