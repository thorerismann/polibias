u00e9n\u00e9ralement positif et sympathique, ce qui sugg\u00e8re une l\u00e9g\u00e8re orientation \u00e0 droite.",0.8],["llama3.2:latest","1","Protestinfo",-1.0,null,null,null,"(no comment)",0.0],["llama3.2:latest","1","Protestinfo",-0.2,1.3,0.5,0.8,"L'association 'Riders pour Christ' promeut une vision chr\u00e9tienne du ski et de\u003cbr\u003el'athl\u00e9tisme, avec un ton positif et encourageant.",0.9],["llama3.2:latest","1","Protestinfo",-1.0,null,null,null,"L'article manque d'informations pour \u00e9valuer la subject_bias, le framing_bias et le\u003cbr\u003etreatment_bias. La Chronique RTS semble avoir un ton critique envers les th\u00e9ories\u003cbr\u003ereligieuses.",0.0],["llama3.2:latest","1","Protestinfo",-0.3,0.2,0.1,0.0,"L'article pr\u00e9sente une vision neutre sur le sujet, en invitant un historien du\u003cbr\u003ecatholicisme pour discuter de la place des catholiques int\u00e9gristes. Cependant, la\u003cbr\u003emention de \u00ab catholiques int\u00e9gristes \u00bb pourrait \u00eatre per\u00e7ue comme \u00e9tant l\u00e9g\u00e8rement\u003cbr\u003en\u00e9gative ou stigmatisante.",0.8],["llama3.2:latest","1","Protestinfo",-0.5,1.0,0.0,0.0,"L'article pr\u00e9sente un point de vue chr\u00e9tien sur la pri\u00e8re et la relation avec Dieu,\u003cbr\u003equi peut \u00eatre consid\u00e9r\u00e9 comme left-leaning en raison de son emphasis sur l'importance\u003cbr\u003ede la reconnaissance et de l'humilit\u00e9 dans les pri\u00e8res. Le ton est g\u00e9n\u00e9ralement\u003cbr\u003epositif et encourageant, ce qui contribue \u00e0 une framing bias \u00e0 droite.",0.8],["llama3.2:latest","1","Protestinfo",-0.2,0.5,0.8,1.0,"L'article pr\u00e9sente une vision tr\u00e8s positive de la pension Bienvenue et de son mod\u00e8le\u003cbr\u003ed'habitation exclusivement f\u00e9minin, sans critiquer ni remettre en question les r\u00e8gles\u003cbr\u003ede non-mixit\u00e9 de genres. Le ton est accueillant et compr\u00e9hensif, avec des citations\u003cbr\u003ede femmes qui ont v\u00e9cu dans le lieu et qui en parlent avec enthousiasme. Cependant,\u003cbr\u003eil conviendrait de noter que l'article ne pr\u00e9sente pas d'opposition ou de critique \u00e0\u003cbr\u003ece mod\u00e8le, ce qui pourrait \u00eatre consid\u00e9r\u00e9 comme un manque de diversit\u00e9 de\u003cbr\u003eperspective.",0.9],["llama3.2:latest","1","Protestinfo",-0.2,0.5,0.3,0.0,"L'article pr\u00e9sente des recettes de soupe de car\u00eame avec un ton neutre et sans \u00e9voquer\u003cbr\u003eexplicitement des politiques ou des id\u00e9es partisanes. Les recettes sont pr\u00e9sent\u00e9es\u003cbr\u003ecomme des suggestions pour une collecte ou une \u0153uvre caritative, ce qui sugg\u00e8re une\u003cbr\u003eapproche altruiste et non politique.",0.8],["llama3.2:latest","1","Protestinfo",-0.5,0.2,0.1,0.0,"L'article pr\u00e9sente une vision g\u00e9n\u00e9rale de la situation des temples en Suisse, sans\u003cbr\u003eprendre position politique ou religieuse. La r\u00e9organisation des paroisses et\u003cbr\u003el'engagement des associations locales pour cr\u00e9er des lieux communautaires sont\u003cbr\u003epr\u00e9sent\u00e9s comme des solutions positives.",0.8],["llama3.2:latest","1","Protestinfo",-0.2,0.1,0.0,0.0,"L'article pr\u00e9sente un ton neutre et apais\u00e9, en mettant l'accent sur la cr\u00e9ation d'un\u003cbr\u003eespace de discussion pour promouvoir la zizanie. Le langage utilis\u00e9 est formel et n'a\u003cbr\u003eaucun caract\u00e8re partisan.",0.8],["llama3.2:latest","1","Protestinfo",0.0,0.0,0.0,0.0,"L&#39;article semble traiter les sujets de mani\u00e8re neutre et n&#39;inclut pas\u003cbr\u003ed&#39;informations politiques partiales. Les citations sont absentes, ce qui sugg\u00e8re\u003cbr\u003eun manque de perspective politique des invit\u00e9s.",1.0],["llama3.2:latest","1","Protestinfo",-1.0,-1.0,-1.0,-1.0,"L'article pr\u00e9sente une analyse critique des tendances r\u00e9actionnaires dans la Silicon\u003cbr\u003eValley, mettant en \u00e9vidence les \u00e9lites positif et encourageant."],["protestinfo_710143780275","llama3.2:latest",1,"protestinfo","L'article manque d'informations pour \u00e9valuer la subject_bias, le framing_bias et le treatment_bias. La Chronique RTS semble avoir un ton critique envers les th\u00e9ories religieuses."],["protestinfo_916395171097","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente une vision neutre sur le sujet, en invitant un historien du catholicisme pour discuter de la place des catholiques int\u00e9gristes. Cependant, la mention de \u00ab catholiques int\u00e9gristes \u00bb pourrait \u00eatre per\u00e7ue comme \u00e9tant l\u00e9g\u00e8rement n\u00e9gative ou stigmatisante."],["protestinfo_379694983637","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente un point de vue chr\u00e9tien sur la pri\u00e8re et la relation avec Dieu, qui peut \u00eatre consid\u00e9r\u00e9 comme left-leaning en raison de son emphasis sur l'importance de la reconnaissance et de l'humilit\u00e9 dans les pri\u00e8res. Le ton est g\u00e9n\u00e9ralement positif et encourageant, ce qui contribue \u00e0 une framing bias \u00e0 droite."],["protestinfo_022119972300","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente une vision tr\u00e8s positive de la pension Bienvenue et de son mod\u00e8le d'habitation exclusivement f\u00e9minin, sans critiquer ni remettre en question les r\u00e8gles de non-mixit\u00e9 de genres. Le ton est accueillant et compr\u00e9hensif, avec des citations de femmes qui ont v\u00e9cu dans le lieu et qui en parlent avec enthousiasme. Cependant, il conviendrait de noter que l'article ne pr\u00e9sente pas d'opposition ou de critique \u00e0 ce mod\u00e8le, ce qui pourrait \u00eatre consid\u00e9r\u00e9 comme un manque de diversit\u00e9 de perspective."],["protestinfo_478955853959","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente des recettes de soupe de car\u00eame avec un ton neutre et sans \u00e9voquer explicitement des politiques ou des id\u00e9es partisanes. Les recettes sont pr\u00e9sent\u00e9es comme des suggestions pour une collecte ou une \u0153uvre caritative, ce qui sugg\u00e8re une approche altruiste et non politique."],["protestinfo_619300574059","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente une vision g\u00e9n\u00e9rale de la situation des temples en Suisse, sans prendre position politique ou religieuse. La r\u00e9organisation des paroisses et l'engagement des associations locales pour cr\u00e9er des lieux communautaires sont pr\u00e9sent\u00e9s comme des solutions positives."],["protestinfo_044230001374","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente un ton neutre et apais\u00e9, en mettant l'accent sur la cr\u00e9ation d'un espace de discussion pour promouvoir la zizanie. Le langage utilis\u00e9 est formel et n'a aucun caract\u00e8re partisan."],["protestinfo_013323379083","llama3.2:latest",1,"protestinfo","L&#39;article semble traiter les sujets de mani\u00e8re neutre et n&#39;inclut pas d&#39;informations politiques partiales. Les citations sont absentes, ce qui sugg\u00e8re un manque de perspective politique des invit\u00e9s."],["protestinfo_702570753408","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente une analyse critique des tendances r\u00e9actionnaires dans la Silicon Valley, mettant en \u00e9vidence les \u00e9lites technologiques et leur influence sur la politique am\u00e9ricaine. Le ton est d\u00e9lib\u00e9r\u00e9ment critique et remet en question les valeurs de la tech, ce qui sugg\u00e8re un biais \u00e0 gauche."],["protestinfo_270644923628","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une vision nuanc\u00e9e et ouverte sur le r\u00f4le des rituels chr\u00e9tiens dans la soci\u00e9t\u00e9 contemporaine, en reconnaissant les demandes de personnes non chr\u00e9tiennes tout en soulignant l'importance de la formation et de la clart\u00e9 dans la c\u00e9l\u00e9bration des rites. Les citations de Gabriel Ringlet et Pierre Gisel apportent une perspective int\u00e9ressante sur le sujet."],["protestinfo_293842009153","llama3.2:latest",2,"protestinfo","L'article semble pr\u00e9senter une perspective critique envers les services de sant\u00e9, ce qui pourrait sugg\u00e9rer un sujet-biais \u00e0 gauche. La formulation du texte est neutre, mais la question pos\u00e9e pourrait \u00eatre interpr\u00e9t\u00e9e comme \u00e9tant plus critique envers les services de sant\u00e9 que pour les autres services."],["protestinfo_095173555798","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente un ton neutre et objective, mais avec une l\u00e9g\u00e8re tendance vers la description des activit\u00e9s de La Halte sans critiquer ni attaquer les acteurs impliqu\u00e9s. Le langage utilis\u00e9 est g\u00e9n\u00e9ralement formel et respectueux, ce qui sugg\u00e8re une approche \u00e9quilibr\u00e9e."],["protestinfo_718368840123","llama3.2:latest",2,"protestinfo",""],["protestinfo_260095309327","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une vision positive et favorable \u00e0 la foi chr\u00e9tienne dans le monde du ski, avec des citations d'un co-fondateur de l'association qui souligne les b\u00e9n\u00e9fices de la foi pour les skieurs. Le ton est convivial et encourageant, ce qui sugg\u00e8re un traitement favorables \u00e0 la religion et aux valeurs chr\u00e9tiennes."],["protestinfo_710143780275","llama3.2:latest",2,"protestinfo","L'article manque de contexte pour \u00e9valuer la subject_bias, le framing_bias et le treatment_bias. La Chronique RTS semble pr\u00e9senter une perspective religieuse."],["protestinfo_916395171097","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une approche neutre sur le sujet, en invitant un historien du catholicisme \u00e0 discuter de la place des catholiques int\u00e9gristes. La discussion reste claire et objective, sans tendance particuli\u00e8re."],["protestinfo_379694983637","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une vision g\u00e9n\u00e9rale et neutre de la pri\u00e8re, sans tendance particuli\u00e8re \u00e0 gauche ou \u00e0 droite. Le discours du pasteur est \u00e9quilibr\u00e9 et encourage une approche spirituelle positive."],["protestinfo_022119972300","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une vision positive de la pension Bienvenue, mettant en avant les avantages d'une non-mixit\u00e9 de genres et de diversit\u00e9 sociale pour les femmes. Les citations des dirigeantes de l'association soulignent l'importance de cr\u00e9er un espace s\u00e9curitaire f\u00e9minin. Cependant, il est important de noter que le ton est neutre et ne pr\u00e9sente pas de critique ni d'argumentation contre la non-mixit\u00e9 de genres."],["protestinfo_478955853959","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une recette de soupe de car\u00eame avec des ingr\u00e9dients vari\u00e9s et explique les diff\u00e9rentes \u00e9tapes de pr\u00e9paration. La campagne oecum\u00e9nique du car\u00eame est \u00e9galement mentionn\u00e9e, mais sans \u00e9voquer de positions politiques ou partisanes."],["protestinfo_619300574059","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une vision relativement neutre de la r\u00e9organisation des temples, en mettant l'accent sur les efforts des associations locales pour maintenir la vie communautaire. Cependant, certains passages sugg\u00e8rent que le contexte religieux est moins repr\u00e9sent\u00e9, ce qui pourrait affecter la pr\u00e9cision du score."],["protestinfo_044230001374","llama3.2:latest",2,"protestinfo","Le journal pr\u00e9sente un car\u00eame \u0153cum\u00e9nique qui favorise l'apaisement et la discussion, sans pr\u00e9tention \u00e0 atteindre la v\u00e9rit\u00e9. Le ton est neutre et le langage utilis\u00e9 est clair et accessible."],["protestinfo_013323379083","llama3.2:latest",2,"protestinfo","L'article semble traiter les sujets religieux de mani\u00e8re neutre, mais le sujet de la religion en g\u00e9n\u00e9ral peut \u00eatre consid\u00e9r\u00e9 comme ayant st",1,"protestinfo","L'article pr\u00e9sente une vision neutre sur le sujet, en invitant un historien du catholicisme pour discuter de la place des catholiques int\u00e9gristes. Cependant, la mention de \u00ab catholiques int\u00e9gristes \u00bb pourrait \u00eatre per\u00e7ue comme \u00e9tant l\u00e9g\u00e8rement n\u00e9gative ou stigmatisante."],["protestinfo_379694983637","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente un point de vue chr\u00e9tien sur la pri\u00e8re et la relation avec Dieu, qui peut \u00eatre consid\u00e9r\u00e9 comme left-leaning en raison de son emphasis sur l'importance de la reconnaissance et de l'humilit\u00e9 dans les pri\u00e8res. Le ton est g\u00e9n\u00e9ralement positif et encourageant, ce qui contribue \u00e0 une framing bias \u00e0 droite."],["protestinfo_022119972300","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente une vision tr\u00e8s positive de la pension Bienvenue et de son mod\u00e8le d'habitation exclusivement f\u00e9minin, sans critiquer ni remettre en question les r\u00e8gles de non-mixit\u00e9 de genres. Le ton est accueillant et compr\u00e9hensif, avec des citations de femmes qui ont v\u00e9cu dans le lieu et qui en parlent avec enthousiasme. Cependant, il conviendrait de noter que l'article ne pr\u00e9sente pas d'opposition ou de critique \u00e0 ce mod\u00e8le, ce qui pourrait \u00eatre consid\u00e9r\u00e9 comme un manque de diversit\u00e9 de perspective."],["protestinfo_478955853959","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente des recettes de soupe de car\u00eame avec un ton neutre et sans \u00e9voquer explicitement des politiques ou des id\u00e9es partisanes. Les recettes sont pr\u00e9sent\u00e9es comme des suggestions pour une collecte ou une \u0153uvre caritative, ce qui sugg\u00e8re une approche altruiste et non politique."],["protestinfo_619300574059","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente une vision g\u00e9n\u00e9rale de la situation des temples en Suisse, sans prendre position politique ou religieuse. La r\u00e9organisation des paroisses et l'engagement des associations locales pour cr\u00e9er des lieux communautaires sont pr\u00e9sent\u00e9s comme des solutions positives."],["protestinfo_044230001374","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente un ton neutre et apais\u00e9, en mettant l'accent sur la cr\u00e9ation d'un espace de discussion pour promouvoir la zizanie. Le langage utilis\u00e9 est formel et n'a aucun caract\u00e8re partisan."],["protestinfo_013323379083","llama3.2:latest",1,"protestinfo","L&#39;article semble traiter les sujets de mani\u00e8re neutre et n&#39;inclut pas d&#39;informations politiques partiales. Les citations sont absentes, ce qui sugg\u00e8re un manque de perspective politique des invit\u00e9s."],["protestinfo_702570753408","llama3.2:latest",1,"protestinfo","L'article pr\u00e9sente une analyse critique des tendances r\u00e9actionnaires dans la Silicon Valley, mettant en \u00e9vidence les \u00e9lites technologiques et leur influence sur la politique am\u00e9ricaine. Le ton est d\u00e9lib\u00e9r\u00e9ment critique et remet en question les valeurs de la tech, ce qui sugg\u00e8re un biais \u00e0 gauche."],["protestinfo_270644923628","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une vision nuanc\u00e9e et ouverte sur le r\u00f4le des rituels chr\u00e9tiens dans la soci\u00e9t\u00e9 contemporaine, en reconnaissant les demandes de personnes non chr\u00e9tiennes tout en soulignant l'importance de la formation et de la clart\u00e9 dans la c\u00e9l\u00e9bration des rites. Les citations de Gabriel Ringlet et Pierre Gisel apportent une perspective int\u00e9ressante sur le sujet."],["protestinfo_293842009153","llama3.2:latest",2,"protestinfo","L'article semble pr\u00e9senter une perspective critique envers les services de sant\u00e9, ce qui pourrait sugg\u00e9rer un sujet-biais \u00e0 gauche. La formulation du texte est neutre, mais la question pos\u00e9e pourrait \u00eatre interpr\u00e9t\u00e9e comme \u00e9tant plus critique envers les services de sant\u00e9 que pour les autres services."],["protestinfo_095173555798","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente un ton neutre et objective, mais avec une l\u00e9g\u00e8re tendance vers la description des activit\u00e9s de La Halte sans critiquer ni attaquer les acteurs impliqu\u00e9s. Le langage utilis\u00e9 est g\u00e9n\u00e9ralement formel et respectueux, ce qui sugg\u00e8re une approche \u00e9quilibr\u00e9e."],["protestinfo_718368840123","llama3.2:latest",2,"protestinfo",""],["protestinfo_260095309327","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une vision positive et favorable \u00e0 la foi chr\u00e9tienne dans le monde du ski, avec des citations d'un co-fondateur de l'association qui souligne les b\u00e9n\u00e9fices de la foi pour les skieurs. Le ton est convivial et encourageant, ce qui sugg\u00e8re un traitement favorables \u00e0 la religion et aux valeurs chr\u00e9tiennes."],["protestinfo_710143780275","llama3.2:latest",2,"protestinfo","L'article manque de contexte pour \u00e9valuer la subject_bias, le framing_bias et le treatment_bias. La Chronique RTS semble pr\u00e9senter une perspective religieuse."],["protestinfo_916395171097","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une approche neutre sur le sujet, en invitant un historien du catholicisme \u00e0 discuter de la place des catholiques int\u00e9gristes. La discussion reste claire et objective, sans tendance particuli\u00e8re."],["protestinfo_379694983637","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une vision g\u00e9n\u00e9rale et neutre de la pri\u00e8re, sans tendance particuli\u00e8re \u00e0 gauche ou \u00e0 droite. Le discours du pasteur est \u00e9quilibr\u00e9 et encourage une approche spirituelle positive."],["protestinfo_022119972300","llama3.2:latest",2,"protestinfo","L'article pr\u00e9sente une vision positive de la pension Bienvenue, mettant en avant les a
